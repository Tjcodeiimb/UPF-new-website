  <style>
    :root {
      --coffee: #3a2b22; --coffee-deep: #271d17; --charcoal: #171514; --cream: #efe4d2;
      --cream-dim: rgba(239, 228, 210, 0.72); --tan: #b9a384; --accent: #2f4fd1; --blue-soft: #9db0ff;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--cream);
      background:
        radial-gradient(ellipse 60% 50% at 88% 0%, rgba(29, 53, 147, 0.28), transparent 70%),
        linear-gradient(160deg, var(--coffee) 0%, var(--coffee-deep) 100%);
    }
    .card {
      position: relative; width: min(560px, 100%); padding: clamp(28px, 5vw, 48px);
      border-radius: 24px; background: var(--charcoal); border: 1px solid rgba(239, 228, 210, 0.08);
      box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.9); overflow: hidden;
      animation: rise 1.1s var(--ease) both;
    }
    .card::before {
      content: ''; position: absolute; left: 12%; right: 12%; top: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue-soft), transparent);
    }
    .check { width: 64px; height: 64px; margin-bottom: 24px; color: var(--blue-soft); }
    .check circle { stroke-dasharray: 176; stroke-dashoffset: 176; animation: draw 1s var(--ease) 0.3s forwards; }
    .check path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 0.6s var(--ease) 1s forwards; }
    .logo { position: absolute; top: 24px; right: 24px; height: 34px; padding: 6px 12px; border-radius: 999px; background: #ece1ce; }
    h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(38px, 6vw, 54px); line-height: 1; margin-bottom: 14px; }
    h1 em { color: var(--blue-soft); }
    p { color: var(--cream-dim); line-height: 1.65; margin-bottom: 14px; }
    .note { font-size: 13px; color: rgba(239, 228, 210, 0.5); }
    .retry { display: none; padding: 12px 14px; border-radius: 12px; background: rgba(224, 144, 127, 0.1); border: 1px solid rgba(224, 144, 127, 0.3); color: #f0b9ab; font-size: 14px; }
    .retry.show { display: block; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 14px 22px; border-radius: 999px;
      font-weight: 700; font-size: 14px; text-decoration: none; transition: transform 0.4s var(--ease), background 0.3s;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: #2744b8; transform: translateY(-2px); }
    .btn.ghost { color: var(--cream); border: 1px solid rgba(239, 228, 210, 0.2); }
    .btn.ghost:hover { border-color: var(--blue-soft); }
    footer { margin-top: 28px; font-size: 12px; color: rgba(239, 228, 210, 0.45); display: flex; flex-wrap: wrap; gap: 14px; }
    footer a { color: inherit; }
    @keyframes rise { from { opacity: 0; transform: translateY(30px) rotate(-0.6deg); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .card, .check circle, .check path { animation: none; stroke-dashoffset: 0; } }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/logo-Daz97ldJ.png" alt="UpForge">
    <svg class="check" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="32" cy="32" r="28" />
      <path d="M24 24l16 16M40 24L24 40" />
    </svg>
    <h1>Lost in the <em>fluff.</em></h1>
    <p>This page doesn't exist, or it was shredded along with the jargon. Let's get you somewhere useful.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to the homepage &rarr;</a>
      <a class="btn ghost" href="/case-studies/">Read our case studies</a>
    </div>
    <footer>
      <a href="/legal/privacy-policy.html">Privacy Policy</a>
      <a href="/legal/terms-conditions.html">Terms</a>
      <a href="/legal/cookie-policy.html">Cookie Policy</a>
      <span>&copy; 2026 UpForge Consulting LLP</span>
    </footer>
  </main>
  <script src="/assets/site-consent.js" defer></script>
</body>
</html>
